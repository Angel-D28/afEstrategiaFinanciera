spring:
  application:
    name: estrategia-financiera

  datasource:
    url: jdbc:postgresql://localhost:5433/af_estrategia_financiera
    username: af_user
    password: af_pass123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    com.af.estrategiafinanciera: DEBUG
    org.hibernate.SQL: DEBUG
